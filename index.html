<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eie</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Eie">
<meta name="theme-color" content="#f5f5f3">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23f7f3ef'/><text x='50%25' y='56%25' dominant-baseline='middle' text-anchor='middle' font-family='Georgia,serif' font-size='38' font-weight='700' fill='%232a2218'>Ei<tspan fill='%23c8b89a'>e</tspan></text></svg>">
<link rel="apple-touch-icon" sizes="180x180" href="eie-touch-icon.png">
<style>
:root{
  --bg:#fafaf8;--bg2:#f2f2ee;--bg3:#e8e8e2;
  --text:#1a1a16;--text2:#4a4a42;--text3:#8a8a7a;
  --border:#e0e0d8;--border2:#c8c8be;
  --accent:#2a2218;--radius:10px;--radius-lg:16px;
  --font:system-ui,-apple-system,sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#181814;--bg2:#222218;--bg3:#2e2e28;
  --text:#f0f0e8;--text2:#b0b0a0;--text3:#686858;
  --border:#2e2e28;--border2:#3e3e36;
}}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;padding:0 0 80px;}
h1{padding:12px 16px 0;}
.nav{display:flex;gap:0;border-bottom:0.5px solid var(--border);padding:0 16px;overflow-x:auto;scrollbar-width:none;}
.nav button{background:none;border:none;padding:10px 14px;font-size:13px;color:var(--text3);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;}
.nav button.active{color:var(--text);border-bottom-color:var(--text);}
.section{display:none;padding:16px;}
.section.active{display:block;}
input,select,textarea{width:100%;padding:9px 12px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;}
textarea{resize:vertical;min-height:70px;}
button.btn-primary{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:14px;font-weight:500;cursor:pointer;margin-top:8px;}
button.btn-ghost{background:none;border:0.5px solid var(--border2);border-radius:var(--radius);padding:8px 14px;font-size:13px;color:var(--text2);cursor:pointer;}
button.btn-small{background:none;border:none;padding:4px 8px;font-size:12px;color:var(--text3);cursor:pointer;}
.field{margin-bottom:12px;}
.field label,.lbl{display:block;font-size:12px;color:var(--text3);margin-bottom:5px;font-weight:500;}
.card{background:var(--bg2);border-radius:var(--radius);padding:12px;margin-bottom:8px;cursor:pointer;}
.card:hover{background:var(--bg3);}
.card-title{font-size:14px;font-weight:500;}
.card-meta{font-size:12px;color:var(--text3);margin-top:3px;}
.card-cats{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
.cat-tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--bg3);color:var(--text2);}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:20px 16px 32px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:16px;font-weight:600;margin-bottom:16px;}
.divider{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text3);margin:16px 0 10px;padding-bottom:4px;border-bottom:0.5px solid var(--border);}
.reg-filter-btn{background:var(--bg2);border:0.5px solid var(--border2);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--text2);cursor:pointer;}
.reg-filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.cat-sq{display:inline-block;border-radius:3px;border:0.5px solid rgba(0,0,0,0.1);position:relative;}
.empty{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:14px;}
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
/* Pie chart */
.pie-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:1rem;}
.pie-legend{display:flex;flex-direction:column;gap:6px;font-size:12px;}
.pie-legend-row{display:flex;align-items:center;gap:6px;}
.analyse-block{background:var(--bg2);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
.analyse-block-title{font-size:13px;font-weight:600;margin-bottom:10px;text-transform:uppercase;letter-spacing:0.04em;color:var(--text2);}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:0.5px solid var(--border);font-size:13px;}
.list-item:last-child{border-bottom:none;}
</style>
</head>
<body>

<h1>
<svg id="eie-logo" width="100%" viewBox="0 0 300 36" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="36" rx="8" fill="#f7f3ef"/>
  <!-- Small list icon -->
  <g transform="translate(12,10)">
    <rect x="0" y="0" width="10" height="2" rx="1" fill="#2a2218" opacity="0.5"/>
    <rect x="0" y="5" width="10" height="2" rx="1" fill="#2a2218" opacity="0.5"/>
    <rect x="0" y="10" width="10" height="2" rx="1" fill="#2a2218" opacity="0.5"/>
    <circle cx="14" cy="1" r="1.5" fill="#2a2218" opacity="0.4"/>
    <circle cx="14" cy="6" r="1.5" fill="#2a2218" opacity="0.4"/>
    <circle cx="14" cy="11" r="1.5" fill="#2a2218" opacity="0.4"/>
  </g>
  <text id="eie-base" x="38" y="18" dominant-baseline="middle" text-anchor="start"
    font-family="Georgia,'Times New Roman',serif" font-size="15.3" font-weight="700" fill="#2a2218">Eie</text>
</svg>
</h1>

<div class="nav">
  <button class="active" onclick="showTab('register',this)">Register</button>
  <button onclick="showTab('kategorier',this)">Kategorier</button>
  <button onclick="showTab('plasseringer',this)">Plasseringer</button>
  <button onclick="showTab('analyse',this)">Analyse</button>
</div>

<!-- REGISTER -->
<div class="section active" id="tab-register">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <span id="reg-count" style="font-size:13px;color:var(--text3)"></span>
    <button class="btn-ghost" onclick="openAddItem()">+ Legg til</button>
  </div>
  <div class="filter-bar" id="reg-filters"></div>
  <div id="reg-list"></div>
</div>

<!-- KATEGORIER -->
<div class="section" id="tab-kategorier">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <span style="font-size:13px;color:var(--text3)">Egne kategorier</span>
    <button class="btn-ghost" onclick="openAddCat()">+ Ny kategori</button>
  </div>
  <div id="cat-list"></div>
</div>

<!-- PLASSERINGER -->
<div class="section" id="tab-plasseringer">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <span style="font-size:13px;color:var(--text3)">Plasseringer</span>
    <button class="btn-ghost" onclick="openAddLoc()">+ Ny plassering</button>
  </div>
  <div id="loc-list"></div>
</div>

<!-- ANALYSE -->
<div class="section" id="tab-analyse">
  <div id="analyse-content"></div>
</div>

<!-- Modal: legg til / rediger ting -->
<div class="modal-overlay" id="item-modal">
  <div class="modal">
    <div class="modal-title" id="item-modal-title">Nytt objekt</div>
    <div class="field"><label>Navn</label><input type="text" id="im-navn" placeholder="Hva er dette?"></div>
    <div class="field"><label>Beskrivelse</label><textarea id="im-besk" placeholder="Valgfri beskrivelse…"></textarea></div>
    <div class="row2" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="field"><label>Merkevare</label><input type="text" id="im-brand" placeholder="F.eks. Samsung…"></div>
      <div class="field"><label>Forhandler</label><input type="text" id="im-vendor" placeholder="F.eks. Elkjøp…"></div>
    </div>
    <div class="field"><label>Kjøpsår</label><input type="number" id="im-year" placeholder="F.eks. 2021" min="1900" max="2100"></div>
    <div class="field">
      <label>Kategorier</label>
      <div id="im-cats" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px"></div>
    </div>
    <div class="field">
      <label>Plassering</label>
      <select id="im-loc"><option value="">Ingen plassering valgt</option></select>
    </div>
    <div class="field">
      <label>Farger</label>
      <div id="im-color-area"></div>
    </div>
    <div class="field"><label>Notater</label><textarea id="im-notes" placeholder="Notater…"></textarea></div>
    <div class="field" style="display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg2);border-radius:var(--radius)">
      <input type="checkbox" id="im-replace" style="width:18px;height:18px;flex-shrink:0;accent-color:#c0392b">
      <label for="im-replace" style="font-size:14px;color:var(--text);cursor:pointer;margin:0">Må erstattes</label>
    </div>
    <button class="btn-primary" onclick="saveItem()">Lagre</button>
    <button class="btn-ghost" style="width:100%;margin-top:8px" onclick="closeItemModal()">Avbryt</button>
    <div id="im-delete-wrap" style="margin-top:8px;display:none">
      <button class="btn-small" style="width:100%;color:#c0392b" onclick="deleteItem()">Slett dette objektet</button>
    </div>
  </div>
</div>

<!-- Modal: ny kategori -->
<div class="modal-overlay" id="cat-modal">
  <div class="modal">
    <div class="modal-title">Ny kategori</div>
    <div class="field"><label>Kategorinavn</label><input type="text" id="cm-navn" placeholder="F.eks. Elektronikk, Kunst, Klær…"></div>
    <button class="btn-primary" onclick="saveCat()">Lagre</button>
    <button class="btn-ghost" style="width:100%;margin-top:8px" onclick="document.getElementById('cat-modal').classList.remove('open')">Avbryt</button>
  </div>
</div>

<!-- Modal: ny plassering -->
<div class="modal-overlay" id="loc-modal">
  <div class="modal">
    <div class="modal-title">Ny plassering</div>
    <div class="field"><label>Plasseringsnavn</label><input type="text" id="lm-navn" placeholder="F.eks. Stue, Kjeller, Kontor…"></div>
    <button class="btn-primary" onclick="saveLoc()">Lagre</button>
    <button class="btn-ghost" style="width:100%;margin-top:8px" onclick="document.getElementById('loc-modal').classList.remove('open')">Avbryt</button>
  </div>
</div>

<script>
// ── DATA ─────────────────────────────────────────────────────────────────────
const FARGE_KAT={
  'Hvit og beige':[{n:'Hvit',h:'#FFFFFF'},{n:'Kremhvit',h:'#FAF6EF'},{n:'Lys beige',h:'#F0E8D9'}],
  'Rød':[{n:'Jordbærrød',h:'#EA1F41'},{n:'Tomatrød',h:'#E04535'},{n:'Rustrød',h:'#9E2415'}],
  'Rosa og fersken':[{n:'Pudderrosa',h:'#FAE0E4'},{n:'Gammelrosa',h:'#D47D7F'},{n:'Lys lakserosa',h:'#EAA898'},{n:'Fuchsia',h:'#FF2D98'},{n:'Cerise',h:'#E8155A'}],
  'Oransje og gul':[{n:'Oransje',h:'#DC7038'},{n:'Lysegul',h:'#F5EFA0'},{n:'Olivengrønn',h:'#6B7A2A'}],
  'Blå':[{n:'Nattblå',h:'#071932'},{n:'Varm blå',h:'#4A7FA0'},{n:'Frisk blå',h:'#5A88B8'},{n:'Himmelblå',h:'#2A90D0'},{n:'Bondeblå',h:'#4A7888'},{n:'Lys bondeblå',h:'#80B0B8'}],
  'Grønn':[{n:'Pistasjgrønn',h:'#C8D9A8'},{n:'Mintgrønn',h:'#7DD4B0'},{n:'Gressgrønn',h:'#61A85A'},{n:'Mørk gressgrønn',h:'#357A42'},{n:'Grangrønn',h:'#235A2E'},{n:'Sjøgrønn',h:'#167065'}],
  'Brun':[{n:'Mørkebrun',h:'#4d2600'},{n:'Lærbrun',h:'#C57E4B'}],
  'Metall':[{n:'Gull',h:'#C5A028',metal:true},{n:'Sølv',h:'#DFDFDF',metal:true}],
  'Grå og svart':[{n:'Mellomgrå',h:'#808080'},{n:'Grå',h:'#A9A9A9'},{n:'Svart',h:'#000000'}],
};

let items=[], cats=[], locs=[], editingItemId=null, filterCat=null, filterLoc=null, filterReplace=false;
const colorSel={};

function loadData(){
  try{items=JSON.parse(localStorage.getItem('eie_items')||'[]');}catch(e){items=[];}
  try{cats=JSON.parse(localStorage.getItem('eie_cats')||'[]');}catch(e){cats=[];}
  try{locs=JSON.parse(localStorage.getItem('eie_locs')||'[]');}catch(e){locs=[];}
}
function saveData(){
  localStorage.setItem('eie_items',JSON.stringify(items));
  localStorage.setItem('eie_cats',JSON.stringify(cats));
  localStorage.setItem('eie_locs',JSON.stringify(locs));
}

// ── COLOR HELPER ─────────────────────────────────────────────────────────────
function catSq(c,size=13){
  if(!c)return'';
  const metal=c.metal||false;
  const star=metal?`<span style="position:absolute;top:0;right:0;width:50%;height:50%;display:flex;align-items:center;justify-content:center;font-size:${Math.max(6,Math.round(size*0.55))}px;line-height:1;color:rgba(255,255,255,0.75);pointer-events:none">✦</span>`:'';
  return`<div class="cat-sq" style="background:${c.h};width:${size}px;height:${size}px;position:relative" title="${c.n}">${star}</div>`;
}

function buildColorAccordion(key, selectedColors){
  const inst={sel:[...selectedColors]};
  colorSel[key]=inst;

  const wrap=document.createElement('div');
  wrap.id='color-acc-'+key;

  const bar=document.createElement('div');
  bar.id='color-bar-'+key;
  bar.style.cssText='display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;min-height:20px;';
  function refreshBar(){
    bar.innerHTML=inst.sel.length
      ?inst.sel.map(c=>`<div style="position:relative;cursor:pointer" title="Fjern ${c.n}" onclick="removeColor('${key}','${c.h}')">
          ${catSq(c,22)}
          <div style="position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:#c0392b;color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;line-height:1">×</div>
        </div>`).join('')
      :'<span style="font-size:12px;color:var(--text3)">Ingen farger valgt</span>';
  }
  refreshBar();
  inst.refresh=refreshBar;

  Object.entries(FARGE_KAT).forEach(([katNavn,shades])=>{
    if(!shades.length)return;
    const sec=document.createElement('details');
    sec.style.marginBottom='6px';
    const sum=document.createElement('summary');
    sum.style.cssText='font-size:12px;color:var(--text3);cursor:pointer;padding:4px 0;';
    sum.textContent=katNavn;
    sec.appendChild(sum);
    const grid=document.createElement('div');
    grid.style.cssText='display:flex;gap:6px;flex-wrap:wrap;padding:6px 0;';
    shades.forEach(shade=>{
      const btn=document.createElement('div');
      btn.title=shade.n;
      btn.style.cssText=`width:28px;height:28px;border-radius:5px;background:${shade.h};border:1.5px solid transparent;cursor:pointer;position:relative;`;
      if(inst.sel.find(s=>s.h===shade.h))btn.style.borderColor='var(--text)';
      if(shade.metal){
        const star=document.createElement('span');
        star.textContent='✦';
        star.style.cssText='position:absolute;top:1px;right:2px;font-size:8px;color:rgba(255,255,255,0.75);';
        btn.appendChild(star);
      }
      btn.onclick=()=>{
        const idx=inst.sel.findIndex(s=>s.h===shade.h);
        if(idx>=0){inst.sel.splice(idx,1);btn.style.borderColor='transparent';}
        else{inst.sel.push(shade);btn.style.borderColor='var(--text)';}
        refreshBar();
      };
      grid.appendChild(btn);
    });
    sec.appendChild(grid);
    wrap.appendChild(sec);
  });

  return{wrap,bar};
}

function removeColor(key,hex){
  const inst=colorSel[key];if(!inst)return;
  inst.sel=inst.sel.filter(s=>s.h!==hex);
  inst.refresh();
  // re-render accordion borders
  const acc=document.getElementById('color-acc-'+key);
  if(acc)acc.querySelectorAll('div[style*="border"]').forEach(d=>{
    const shade=Object.values(FARGE_KAT).flat().find(s=>d.style.background===s.h);
    if(shade)d.style.borderColor=inst.sel.find(s=>s.h===shade.h)?'var(--text)':'transparent';
  });
}

// ── TABS ─────────────────────────────────────────────────────────────────────
function showTab(id,btn){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  btn.classList.add('active');
  if(id==='register')renderRegister();
  if(id==='kategorier')renderKategorier();
  if(id==='plasseringer')renderPlasseringer();
  if(id==='analyse')renderAnalyse();
}

// ── REGISTER ─────────────────────────────────────────────────────────────────
function renderRegister(){
  // Filters
  const filters=document.getElementById('reg-filters');
  filters.innerHTML=`
    <button class="reg-filter-btn${filterCat===null&&filterLoc===null&&!filterReplace?' active':''}" onclick="filterCat=null;filterLoc=null;filterReplace=false;renderRegister()">Alle</button>
    <button class="reg-filter-btn${filterReplace?' active':''}" style="color:${filterReplace?'#fff':'#c0392b'};border-color:#c0392b;${filterReplace?'background:#c0392b':''}" onclick="filterReplace=!filterReplace;filterCat=null;filterLoc=null;renderRegister()">Må erstattes</button>
    ${cats.map(c=>`<button class="reg-filter-btn${filterCat===c.id?' active':''}" onclick="filterCat='${c.id}';filterLoc=null;filterReplace=false;renderRegister()">${c.naam}</button>`).join('')}
    ${locs.map(l=>`<button class="reg-filter-btn${filterLoc===l.id?' active':''}" onclick="filterLoc='${l.id}';filterCat=null;filterReplace=false;renderRegister()">📍${l.naam}</button>`).join('')}
  `;

  let list=items;
  if(filterCat)list=list.filter(i=>(i.cats||[]).includes(filterCat));
  if(filterLoc)list=list.filter(i=>i.loc===filterLoc);
  if(filterReplace)list=list.filter(i=>i.mustReplace);

  document.getElementById('reg-count').textContent=`${list.length} av ${items.length} objekter`;

  const cont=document.getElementById('reg-list');
  if(!list.length){
    cont.innerHTML=`<div class="empty">${items.length?'Ingen objekter matcher filteret.':'Ingen objekter ennå.<br><span style="font-size:12px">Trykk «+ Legg til» for å komme i gang.</span>'}</div>`;
    return;
  }

  cont.innerHTML=list.map(item=>{
    const itemCats=(item.cats||[]).map(cid=>cats.find(c=>c.id===cid)?.naam).filter(Boolean);
    const loc=locs.find(l=>l.id===item.loc);
    const dots=(item.colors||[]).map(c=>catSq(c,14)).join('');
    return`<div class="card" onclick="openEditItem('${item.id}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="display:flex;align-items:center;gap:6px;flex:1;min-width:0">
          <div class="card-title">${item.naam}</div>
          ${item.mustReplace?`<span style="font-size:10px;padding:1px 6px;border-radius:10px;background:#fde8e8;color:#c0392b;white-space:nowrap;flex-shrink:0">Må erstattes</span>`:''}
        </div>
        ${dots?`<div style="display:flex;gap:3px;margin-left:8px;flex-shrink:0">${dots}</div>`:''}
      </div>
      ${item.besk?`<div class="card-meta">${item.besk}</div>`:''}
      ${(item.brand||item.year)?`<div class="card-meta">${[item.brand,item.year?'kjøpt '+item.year:''].filter(Boolean).join(' · ')}</div>`:''}
      <div style="display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap">
        ${itemCats.map(c=>`<span class="cat-tag">${c}</span>`).join('')}
        ${loc?`<span style="font-size:11px;color:var(--text3)">📍 ${loc.naam}</span>`:''}
      </div>
    </div>`;
  }).join('');
}

// ── ITEM MODAL ───────────────────────────────────────────────────────────────
function openAddItem(){
  editingItemId=null;
  document.getElementById('item-modal-title').textContent='Nytt objekt';
  document.getElementById('im-navn').value='';
  document.getElementById('im-besk').value='';
  document.getElementById('im-brand').value='';
  document.getElementById('im-vendor').value='';
  document.getElementById('im-year').value='';
  document.getElementById('im-notes').value='';
  document.getElementById('im-replace').checked=false;
  document.getElementById('im-delete-wrap').style.display='none';
  renderImCats([]);
  renderImLoc('');
  const area=document.getElementById('im-color-area');
  area.innerHTML='';
  const{wrap,bar}=buildColorAccordion('im',[]);
  area.appendChild(bar);area.appendChild(wrap);
  document.getElementById('item-modal').classList.add('open');
  setTimeout(()=>document.getElementById('im-navn').focus(),100);
}

function openEditItem(id){
  const item=items.find(i=>i.id===id);if(!item)return;
  editingItemId=id;
  document.getElementById('item-modal-title').textContent='Rediger objekt';
  document.getElementById('im-navn').value=item.naam;
  document.getElementById('im-besk').value=item.besk||'';
  document.getElementById('im-brand').value=item.brand||'';
  document.getElementById('im-vendor').value=item.vendor||'';
  document.getElementById('im-year').value=item.year||'';
  document.getElementById('im-notes').value=item.notes||'';
  document.getElementById('im-replace').checked=item.mustReplace||false;
  document.getElementById('im-delete-wrap').style.display='block';
  renderImCats(item.cats||[]);
  renderImLoc(item.loc||'');
  const area=document.getElementById('im-color-area');
  area.innerHTML='';
  const{wrap,bar}=buildColorAccordion('im',item.colors||[]);
  area.appendChild(bar);area.appendChild(wrap);
  document.getElementById('item-modal').classList.add('open');
}

function renderImCats(selected){
  const cont=document.getElementById('im-cats');
  if(!cats.length){cont.innerHTML='<span style="font-size:12px;color:var(--text3)">Ingen kategorier ennå — lag dem i Kategorier-fanen.</span>';return;}
  cont.innerHTML=cats.map(c=>`
    <button class="reg-filter-btn${selected.includes(c.id)?' active':''}" style="font-size:11px;padding:3px 10px"
      onclick="toggleImCat('${c.id}')">${c.naam}</button>`).join('');
}
function toggleImCat(id){
  const btn=document.querySelector(`#im-cats .reg-filter-btn[onclick*="${id}"]`);
  if(btn)btn.classList.toggle('active');
}
function getImCats(){return [...document.querySelectorAll('#im-cats .reg-filter-btn.active')].map(b=>{
  const m=b.getAttribute('onclick').match(/'([^']+)'/);return m?m[1]:null;}).filter(Boolean);}

function renderImLoc(selected){
  const sel=document.getElementById('im-loc');
  sel.innerHTML='<option value="">Ingen plassering</option>'+locs.map(l=>`<option value="${l.id}"${selected===l.id?' selected':''}>${l.naam}</option>`).join('');
}

function closeItemModal(){document.getElementById('item-modal').classList.remove('open');delete colorSel['im'];}

function saveItem(){
  const naam=document.getElementById('im-navn').value.trim();
  if(!naam){alert('Skriv inn et navn.');return;}
  const colors=(colorSel['im']?.sel||[]).map(c=>({n:c.n,h:c.h}));
  const data={naam,besk:document.getElementById('im-besk').value.trim(),brand:document.getElementById('im-brand').value.trim(),vendor:document.getElementById('im-vendor').value.trim(),year:document.getElementById('im-year').value||null,cats:getImCats(),loc:document.getElementById('im-loc').value||null,colors,notes:document.getElementById('im-notes').value.trim(),mustReplace:document.getElementById('im-replace').checked};
  if(editingItemId){
    const idx=items.findIndex(i=>i.id===editingItemId);
    if(idx>=0)items[idx]={...items[idx],...data};
  } else {
    items.push({id:'itm'+Date.now(),...data});
  }
  saveData();closeItemModal();renderRegister();
}

function deleteItem(){
  if(!editingItemId)return;
  if(!confirm('Slette dette objektet?'))return;
  items=items.filter(i=>i.id!==editingItemId);
  saveData();closeItemModal();renderRegister();
}

// ── KATEGORIER ───────────────────────────────────────────────────────────────
function renderKategorier(){
  const cont=document.getElementById('cat-list');
  if(!cats.length){cont.innerHTML='<div class="empty">Ingen kategorier ennå.</div>';return;}
  cont.innerHTML=cats.map(c=>{
    const count=items.filter(i=>(i.cats||[]).includes(c.id)).length;
    return`<div class="card" style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div class="card-title">${c.naam}</div>
        <div class="card-meta">${count} objekt${count!==1?'er':''}</div>
      </div>
      <button class="btn-small" onclick="deleteCat('${c.id}')">Slett</button>
    </div>`;
  }).join('');
}
function openAddCat(){document.getElementById('cm-navn').value='';document.getElementById('cat-modal').classList.add('open');setTimeout(()=>document.getElementById('cm-navn').focus(),100);}
function saveCat(){
  const naam=document.getElementById('cm-navn').value.trim();
  if(!naam)return;
  cats.push({id:'cat'+Date.now(),naam});
  saveData();document.getElementById('cat-modal').classList.remove('open');renderKategorier();
}
function deleteCat(id){
  if(!confirm('Slette denne kategorien?'))return;
  cats=cats.filter(c=>c.id!==id);
  items.forEach(i=>i.cats=(i.cats||[]).filter(c=>c!==id));
  saveData();renderKategorier();
}

// ── PLASSERINGER ─────────────────────────────────────────────────────────────
function renderPlasseringer(){
  const cont=document.getElementById('loc-list');
  if(!locs.length){cont.innerHTML='<div class="empty">Ingen plasseringer ennå.</div>';return;}
  cont.innerHTML=locs.map(l=>{
    const count=items.filter(i=>i.loc===l.id).length;
    return`<div class="card" style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div class="card-title">📍 ${l.naam}</div>
        <div class="card-meta">${count} objekt${count!==1?'er':''}</div>
      </div>
      <button class="btn-small" onclick="deleteLoc('${l.id}')">Slett</button>
    </div>`;
  }).join('');
}
function openAddLoc(){document.getElementById('lm-navn').value='';document.getElementById('loc-modal').classList.add('open');setTimeout(()=>document.getElementById('lm-navn').focus(),100);}
function saveLoc(){
  const naam=document.getElementById('lm-navn').value.trim();
  if(!naam)return;
  locs.push({id:'loc'+Date.now(),naam});
  saveData();document.getElementById('loc-modal').classList.remove('open');renderPlasseringer();
}
function deleteLoc(id){
  if(!confirm('Slette denne plasseringen?'))return;
  locs=locs.filter(l=>l.id!==id);
  items.forEach(i=>{if(i.loc===id)i.loc=null;});
  saveData();renderPlasseringer();
}

// ── ANALYSE ──────────────────────────────────────────────────────────────────
function renderAnalyse(){
  const cont=document.getElementById('analyse-content');
  if(!items.length){cont.innerHTML='<div class="empty">Ingen objekter ennå.</div>';return;}

  function pieChart(data,size=120){
    if(!data.length)return'';
    const total=data.reduce((s,d)=>s+d.v,0);
    if(!total)return'';
    let angle=-90,svg=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
    const cx=size/2,cy=size/2,r=size/2-4;
    data.forEach(d=>{
      const sweep=d.v/total*360;
      const a1=angle*Math.PI/180,a2=(angle+sweep)*Math.PI/180;
      const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
      const x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
      const large=sweep>180?1:0;
      if(Math.abs(sweep-360)<0.01){
        svg+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${d.color}"/>`;
      } else {
        svg+=`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} Z" fill="${d.color}"/>`;
      }
      angle+=sweep;
    });
    svg+='</svg>';
    return svg;
  }

  const COLORS=['#4A7FA0','#EA1F41','#61A85A','#DC7038','#D47D7F','#C5A028','#235A2E','#9E2415','#7DD4B0','#808080','#4d2600','#FF2D98','#071932','#C57E4B','#F5EFA0'];

  // Kategorier
  const catData=cats.map((c,i)=>{
    const count=items.filter(it=>(it.cats||[]).includes(c.id)).length;
    return{label:c.naam,v:count,color:COLORS[i%COLORS.length]};
  }).filter(d=>d.v>0).sort((a,b)=>b.v-a.v);
  const noCat=items.filter(i=>!(i.cats||[]).length).length;
  if(noCat)catData.push({label:'Uten kategori',v:noCat,color:'#ccc'});

  // Plasseringer
  const locData=locs.map((l,i)=>{
    const count=items.filter(it=>it.loc===l.id).length;
    return{label:l.naam,v:count,color:COLORS[(i+4)%COLORS.length]};
  }).filter(d=>d.v>0).sort((a,b)=>b.v-a.v);
  const noLoc=items.filter(i=>!i.loc).length;
  if(noLoc)locData.push({label:'Ingen plassering',v:noLoc,color:'#ccc'});

  // Farger
  const colorCount={};
  items.forEach(i=>(i.colors||[]).forEach(c=>{colorCount[c.h]=(colorCount[c.h]||{...c,count:0}),colorCount[c.h].count++;}));
  const colorData=Object.values(colorCount).sort((a,b)=>b.count-a.count).slice(0,10).map(c=>({label:c.n,v:c.count,color:c.h}));

  function block(title,data){
    if(!data.length)return'';
    const pie=pieChart(data);
    const legend=data.map(d=>`<div class="pie-legend-row">
      <div style="width:12px;height:12px;border-radius:3px;background:${d.color};flex-shrink:0"></div>
      <span>${d.label} <span style="color:var(--text3)">(${d.v})</span></span>
    </div>`).join('');
    return`<div class="analyse-block">
      <div class="analyse-block-title">${title}</div>
      <div class="pie-wrap">
        ${pie}
        <div class="pie-legend">${legend}</div>
      </div>
    </div>`;
  }

  // Totalt
  cont.innerHTML=`
    <div class="analyse-block">
      <div class="analyse-block-title">Oversikt</div>
      <div class="list-item"><span>Objekter totalt</span><strong>${items.length}</strong></div>
      <div class="list-item"><span>Kategorier</span><strong>${cats.length}</strong></div>
      <div class="list-item"><span>Plasseringer</span><strong>${locs.length}</strong></div>
      <div class="list-item"><span style="color:#c0392b">Må erstattes</span><strong style="color:#c0392b">${items.filter(i=>i.mustReplace).length}</strong></div>
    </div>
    ${block('Kategorier',catData)}
    ${block('Plasseringer',locData)}
    ${block('Farger',colorData)}
  `;
}

// ── BACKUP ───────────────────────────────────────────────────────────────────
function exportBackup(){
  const data=JSON.stringify({items,cats,locs},null,2);
  const a=document.createElement('a');
  a.href='data:application/json,'+encodeURIComponent(data);
  a.download='eie-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}

// ── INIT ─────────────────────────────────────────────────────────────────────
loadData();
renderRegister();
</script>
